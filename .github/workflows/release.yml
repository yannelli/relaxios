name: Release

on:
  push:
    branches: [main, beta, alpha]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/alpha'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish semantic release
        run: node scripts/release.mjs --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tarball goes to the GitHub release before npm, so a failed publish can be finished by hand from it.
      - name: Publish npm package
        run: |
          npm -v
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "npm already has $name@$version"
            exit 0
          fi
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball="$RUNNER_TEMP/$name-$version.tgz"
          gh release upload "v$version" "$tarball" --clobber
          if [[ "$version" == *-beta.* ]]; then
            npm publish "$tarball" --tag beta
          elif [[ "$version" == *-alpha.* ]]; then
            npm publish "$tarball" --tag alpha
          else
            npm publish "$tarball"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
