name: CI

# Pull requests run these checks; pushes to release branches run them through release.yml.
on:
  pull_request:
    branches: [main, beta, alpha]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The package imports its own subpaths by name; Bun and Deno resolve that through node_modules.
      - run: ln -s .. node_modules/relaxios
      - run: npm test
      - run: npm run test:release
      - run: node scripts/smoke.mjs
      - run: npm pack --dry-run

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size

  e2e:
    name: browsers (progress, xsrf, xhr upload, differential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e

  axios-suite:
    name: axios 1.20.0 test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix test/axios ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm --prefix test/axios test
      - run: npm --prefix test/axios run test:browser

  mock-adapter:
    name: axios-mock-adapter suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm --prefix test/mock-adapter ci
      - run: npm --prefix test/mock-adapter test

  runtimes:
    name: smoke (${{ matrix.runtime }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [node20, bun, deno]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: ln -s .. node_modules/relaxios
      - if: matrix.runtime == 'node20'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: matrix.runtime == 'node20'
        run: node scripts/smoke.mjs
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun scripts/smoke.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno run -A scripts/smoke.mjs
